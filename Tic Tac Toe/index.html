<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>
            Tic Tac Toe
        </h1>
    </header>
    <div class="scores">
        <div class="score">
            <p>Player X</p>
            <p id="Player-X">0</p>
        </div>
        <div class="score">
            <p>Player O</p>
            <p id="Player-O">0</p>
        </div>
    </div>
    <div class="container">
        <div class="game">
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
        </div>
    </div>
    <p id="msg" class="hide">Winner is</p>

    <button id="reset">Restart Game</button>
    <script src="script.js"></script>
</body>

</html>
