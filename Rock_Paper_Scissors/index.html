<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Rock Paper Scissors</h1>
    </header>
    <div class="images">
        <img class="img1" src="assets/rock.png" alt="rock">
        <img class="img2" src="assets/paper.png" alt="paper">
        <img class="img3" src="assets/scissors.png" alt="scissors">
    </div>
    <div class="scores">
        <div class="user-score">0</div>
        <p>Your Score</p>
        <div class="Computer-score">0</div>
        <p>Computer Score</p>
    </div>
    <div class="msg">
        Make Your Choices
    </div>
    <script src="script.js"></script>
</body>
</html>
