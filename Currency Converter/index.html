<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <H1>
            Currency Converter
        </H1>
    </header>

    <main>
        <h1>
            Currency Converter
        </h1>
        
        <p>Enter Amount</p>
        <input type="text" name="text" required placeholder="100">
        <div class="options">
            <p>From</p>
            <select  >
                <option value="USD">USD</option>
                <option value="PK">PK</option>
                <option value="EURO">EURO</option>
                <option value="AED">AED</option>
            </select>
        </div>
        <div class="options">
            <p>To</p>
            <img src="R.png" alt="a">
            <select  >
                <option value="USD">USD</option>
                <option value="PK">PK</option>
                <option value="EURO">EURO</option>
                <option value="AED">AED</option>
            </select>
        </div>
    </main>
    <script src="file.js"></script>
    <script src="code.js"></script>
</body>
</html>
